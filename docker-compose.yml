version: '3.8'

services:
  orders-api:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      - PORT=3000
      - DB_USER=labuser
      - DB_PASSWORD=labpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=labdb
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpassword
      - POSTGRES_DB=labdb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
